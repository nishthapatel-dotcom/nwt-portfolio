<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .todo-app { max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 10px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .completed { text-decoration: line-through; color: #adb5bd; }
        .task-text { cursor: pointer; flex-grow: 1; margin-left: 10px; font-size: 1.1rem;}
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="todo-app border">
            <h2 class="text-center mb-4 fw-bold text-warning"><i class="bi bi-card-checklist"></i> To-Do List</h2>
            <div class="input-group mb-4">
                <input type="text" id="taskInput" class="form-control form-control-lg" placeholder="Add a new task...">
                <button class="btn btn-warning fw-bold px-4" onclick="addTask()">Add</button>
            </div>
            <ul class="list-group" id="taskList">
                <!-- Example task -->
                <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                    <div class="d-flex align-items-center flex-grow-1">
                        <input class="form-check-input me-2" type="checkbox" onchange="toggleTask(this)">
                        <span class="task-text" onclick="this.previousElementSibling.click()">Buy Groceries</span>
                    </div>
                    <button class="btn btn-sm btn-outline-danger border-0" onclick="this.parentElement.remove()"><i class="bi bi-trash fs-5"></i></button>
                </li>
            </ul>
            <a href="index.html" class="btn btn-outline-dark mt-4 w-100 fw-bold">Back to Portfolio</a>
        </div>
    </div>
    <script>
        const input = document.getElementById('taskInput');
        
        // Add task on enter key
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        function toggleTask(checkbox) {
            const span = checkbox.nextElementSibling;
            if (checkbox.checked) {
                span.classList.add('completed');
            } else {
                span.classList.remove('completed');
            }
        }

        function addTask() {
            const taskText = input.value.trim();
            if(taskText !== '') {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center py-3';
                li.innerHTML = `
                    <div class="d-flex align-items-center flex-grow-1">
                        <input class="form-check-input me-2" type="checkbox" onchange="toggleTask(this)">
                        <span class="task-text" onclick="this.previousElementSibling.click()">${taskText}</span>
                    </div>
                    <button class="btn btn-sm btn-outline-danger border-0" onclick="this.parentElement.remove()"><i class="bi bi-trash fs-5"></i></button>
                `;
                document.getElementById('taskList').appendChild(li);
                input.value = '';
            }
        }
    </script>
</body>
</html>
