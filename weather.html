<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .weather-app { max-width: 450px; margin: 50px auto; padding: 40px 30px; border-radius: 20px; background: linear-gradient(135deg, #0dcaf0 0%, #0d6efd 100%); color: white; box-shadow: 0 15px 30px rgba(13, 110, 253, 0.2); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="weather-app text-center" id="appCard">
            <h2 class="mb-4 fw-bold"><i class="bi bi-cloud-sun"></i> Live Weather</h2>
            <div class="input-group mb-5 shadow-sm">
                <input type="text" id="cityInput" class="form-control form-control-lg border-0" placeholder="Enter city name..." value="New York">
                <button class="btn btn-light text-primary fw-bold px-4" onclick="checkWeather()">Check</button>
            </div>
            <div id="weatherResult" class="py-2">
                <i class="bi bi-brightness-high display-1"></i>
                <h1 class="display-2 fw-bold mt-3">22°C</h1>
                <h3 class="fw-normal">New York</h3>
                <p class="fs-5 text-white-50">Sunny and Clear</p>
            </div>
            <a href="index.html" class="btn btn-outline-light mt-5 w-100 fw-bold rounded-pill">Back to Portfolio</a>
        </div>
    </div>
    <script>
        const input = document.getElementById('cityInput');
        input.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') checkWeather();
        });

        // Simple mock weather generator
        function checkWeather() {
            const city = input.value || 'Unknown City';
            const temp = Math.floor(Math.random() * 30) + 5; // Random temp between 5 and 35
            const conditions = [
                { text: 'Sunny', icon: 'bi-brightness-high', bg: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)'},
                { text: 'Cloudy', icon: 'bi-cloud', bg: 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)'},
                { text: 'Rainy', icon: 'bi-cloud-rain', bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'},
                { text: 'Clear Night', icon: 'bi-moon-stars', bg: 'linear-gradient(135deg, #29323c 0%, #485563 100%)'},
                { text: 'Windy', icon: 'bi-wind', bg: 'linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%)'}
            ];
            const randomIdx = Math.floor(Math.random() * conditions.length);
            const condition = conditions[randomIdx];
            
            // Update Card Background
            document.getElementById('appCard').style.background = condition.bg;

            document.getElementById('weatherResult').innerHTML = `
                <i class="bi ${condition.icon} display-1"></i>
                <h1 class="display-2 fw-bold mt-3">${temp}°C</h1>
                <h3 class="fw-normal">${city}</h3>
                <p class="fs-5 text-white-50">${condition.text}</p>
            `;
        }
    </script>
</body>
</html>
