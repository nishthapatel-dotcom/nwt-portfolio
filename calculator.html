<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calculator { max-width: 350px; margin: 50px auto; padding: 20px; border-radius: 10px; background: #f8f9fa; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .display { font-size: 2.5rem; background: #e9ecef; text-align: right; padding: 15px; border-radius: 5px; margin-bottom: 20px; min-height: 80px; overflow: hidden; }
        .btn-calc { font-size: 1.5rem; margin: 5px; width: 65px; height: 65px; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="calculator text-center border">
            <h3 class="mb-4 text-primary fw-bold">Calculator</h3>
            <div class="display border" id="display">0</div>
            <div class="row gx-1 justify-content-center">
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('7')">7</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('8')">8</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('9')">9</button></div>
                <div class="col-auto"><button class="btn btn-primary btn-calc" onclick="appendValue('/')">/</button></div>
            </div>
            <div class="row gx-1 justify-content-center mt-1">
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('4')">4</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('5')">5</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('6')">6</button></div>
                <div class="col-auto"><button class="btn btn-primary btn-calc" onclick="appendValue('*')">x</button></div>
            </div>
            <div class="row gx-1 justify-content-center mt-1">
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('1')">1</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('2')">2</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('3')">3</button></div>
                <div class="col-auto"><button class="btn btn-primary btn-calc" onclick="appendValue('-')">-</button></div>
            </div>
            <div class="row gx-1 justify-content-center mt-1">
                <div class="col-auto"><button class="btn btn-danger btn-calc" onclick="clearDisplay()">C</button></div>
                <div class="col-auto"><button class="btn btn-secondary btn-calc" onclick="appendValue('0')">0</button></div>
                <div class="col-auto"><button class="btn btn-success btn-calc" onclick="calculate()">=</button></div>
                <div class="col-auto"><button class="btn btn-primary btn-calc" onclick="appendValue('+')">+</button></div>
            </div>
            <a href="index.html" class="btn btn-outline-dark mt-4 w-100 fw-bold">Back to Portfolio</a>
        </div>
    </div>
    <script>
        let display = document.getElementById('display');
        function appendValue(val) {
            if(display.innerText === '0' || display.innerText === 'Error') {
                display.innerText = val;
            } else {
                display.innerText += val;
            }
        }
        function clearDisplay() { display.innerText = '0'; }
        function calculate() {
            try { 
                // Eval used for simplicity in this basic mock project
                let result = eval(display.innerText); 
                // handle decimals
                display.innerText = Math.round(result * 100) / 100;
            }
            catch(e) { display.innerText = 'Error'; }
        }
    </script>
</body>
</html>
